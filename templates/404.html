{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="card shadow p-4 border-0 rounded-4">
            <div class="eyebrow text-uppercase fw-bold text-muted mb-2">404 ERROR</div>
            <h1 class="display-5 fw-bold mb-3">Page Not Found</h1>
            <p class="text-secondary mb-4">
                The page or resource you requested could not be found. It may have been moved, renamed, or is temporarily unavailable.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('home') }}" class="btn btn-primary px-4">Back to Home</a>
                {% if session.user_id %}
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary px-4">Dashboard</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
