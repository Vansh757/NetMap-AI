{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="card shadow p-4 border-0 rounded-4">
            <div class="eyebrow text-uppercase fw-bold text-danger mb-2">500 ERROR</div>
            <h1 class="display-5 fw-bold mb-3">Internal Server Error</h1>
            <p class="text-secondary mb-4">
                An unexpected server condition occurred while processing your request. Please try again shortly.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('home') }}" class="btn btn-primary px-4">Back to Home</a>
                <a href="{{ url_for('contact') }}" class="btn btn-outline-secondary px-4">Contact Support</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
